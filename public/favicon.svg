<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <style>
      .silhouette { fill: #D2AE6D; }
      .background { fill: #ffffff; }
    </style>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="16" class="background"/>
  
  <!-- Pregnant woman silhouette -->
  <g class="silhouette">
    <!-- Head -->
    <circle cx="16" cy="7.5" r="2.5"/>
    
    <!-- Body with pregnancy curve -->
    <path d="M 13.5 10
             C 13 10.5, 12.5 11.5, 12.5 13
             C 12.5 15, 12 17, 12.5 19
             C 12.8 20.5, 13.5 21.5, 14.5 22.5
             L 17.5 22.5
             C 18.5 21.5, 19.2 20.5, 19.5 19
             C 20 17, 19.5 15, 19.5 13
             C 19.5 11.5, 19 10.5, 18.5 10
             L 18 10.5
             C 18.2 11.5, 18.5 13, 18.2 15
             C 18 16.8, 17.2 18, 16 18
             C 14.8 18, 14 16.8, 13.8 15
             C 13.5 13, 13.8 11.5, 14 10.5
             L 13.5 10 Z"/>
    
    <!-- Arms -->
    <ellipse cx="11" cy="13.5" rx="1" ry="3" transform="rotate(-20 11 13.5)"/>
    <ellipse cx="21" cy="13.5" rx="1" ry="3" transform="rotate(20 21 13.5)"/>
    
    <!-- Legs -->
    <rect x="14" y="22.5" width="1.5" height="6" rx="0.7"/>
    <rect x="16.5" y="22.5" width="1.5" height="6" rx="0.7"/>
  </g>
</svg>